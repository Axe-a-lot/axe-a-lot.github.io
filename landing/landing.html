<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать Мой Кэшбэк</title>

    <link rel="icon" type="image/svg+xml" href="logo.svg">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Мой кэшбэк - удобный менеджер кэшбэков">
    <meta property="og:description" content="Все категории кэшбэка в одном месте. Узнай, какой картой платить выгоднее прямо сейчас!">
    <meta property="og:image" content="logo.png"> 

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --text-color: #1A1A1A;
            --bg-color: #F8F9FA;
            --secondary-text: #666;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .main-content {
            flex-grow: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .container {
            text-align: center;
            padding: 40px 24px;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            margin: auto;
        }

        .logo {
            width: 130px;
            height: 130px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08); 
            border-radius: 22px;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 16px;
            color: var(--secondary-text);
            margin: 0 0 32px;
            line-height: 1.5;
        }

        .download-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .download-btn {
            display: block;
            width: 100%;
            max-width: 220px;
            transition: transform 0.1s ease-in-out;
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        .download-btn img {
            width: 100%;
            height: auto;
            display: block;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 24px 0;
            color: var(--secondary-text);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: auto; 
        }

        @media (max-width: 400px) {
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="main-content">
    <div class="container">
        <div class="logo">
            <img src="logo.svg" alt="Logo">
        </div>

        <h1>Удобный менеджер кэшбэков</h1>
        <p>Все категории кэшбэков в одном приложении. Платите с максимальной выгодой каждый день.</p>

        <div class="download-links">
            <a href="https://www.rustore.ru/catalog/app/com.axealot.mycashback" class="download-btn">
                <img src="button_rustore.svg" alt="Скачать в RuStore">
            </a>

            <a href="https://play.google.com/store/apps/details?id=com.axealot.mycashback" class="download-btn">
                <img src="button_google_play.svg" alt="Скачать в Google Play">
            </a>
        </div>
    </div>
</div>

<footer>
    Axe a lot
</footer>

</body>
</html>
